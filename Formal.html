<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formal Wear | HostelMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script src="/cart_global.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8f9fa; color: #1a1a1a; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="antialiased">
    <header class="bg-white sticky top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2">
                <span class="text-2xl font-black italic"><span class="text-[#8D6E63]">Hostel</span><span class="text-[#C8A951]">Mart</span></span>
            </a>
            <div class="flex items-center gap-6">
                <a href="/Cart.html" class="relative group">
                    <ion-icon name="cart-outline" class="text-2xl text-gray-700"></ion-icon>
                    <span class="absolute -top-2 -right-2 bg-[#C8A951] text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold cart-badge">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-black text-gray-900 mb-8">Formal Wear Collection</h1>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6" id="product-grid"></div>
    </main>

    <script>
        async function fetchProducts() {
            const res = await fetch('/api/products?category=Fashion&subcategory=Formal');
            const products = await res.json();
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="product-card bg-white rounded-3xl border border-gray-100 overflow-hidden transition-all duration-300 flex flex-col group shadow-sm">
                    <div class="relative aspect-[3/4] overflow-hidden bg-gray-50 cursor-pointer" onclick="window.location.href='/product/${p.slug}'">
                        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition-transform">
                    </div>
                    <div class="p-5 flex flex-col flex-1">
                        <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">${p.brand}</span>
                        <h3 class="font-bold text-gray-900 text-sm line-clamp-2 mb-2 cursor-pointer" onclick="window.location.href='/product/${p.slug}'">${p.name}</h3>
                        <div class="mt-auto">
                            <span class="text-lg font-black text-gray-900">₹${p.price.toLocaleString('en-IN')}</span>
                            <div class="grid grid-cols-2 gap-2 mt-4">
                                <button data-cart-action="add" data-mini="true" data-product-slug="${p.slug}" data-product-name="${p.name}" data-product-price="₹${p.price}" data-product-image="${p.image}" data-product-brand="${p.brand}" class="bg-gray-100 text-gray-900 py-3 rounded-xl font-bold text-xs hover:bg-gray-200 transition-all uppercase tracking-widest">Add</button>
                                <button onclick="window.location.href='/Checkout.html?slug=${p.slug}'" class="bg-[#5D4037] text-white py-3 rounded-xl font-bold text-xs hover:bg-[#3E2723] transition-all uppercase tracking-widest">Buy</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            if (window.syncCartButtons) window.syncCartButtons();
        }
        fetchProducts();
    </script>
</body>
</html>
