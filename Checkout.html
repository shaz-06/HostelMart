<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | HostelMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="address_global.js" defer></script>
    <script src="auth_global.js" defer></script>
    <script src="profile_global.js" defer></script>
    <script src="cart_global.js" defer></script>
    <style>
        :root {
            --cream: #FDFBF7;
            --cream-dark: #F5F5DC;
            --brown: #3E2723;
            --brown-medium: #5D4037;
            --brown-light: #8D6E63;
            --gold: #C5A059;
            --gold-light: #FDF5E6;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--cream); 
            color: var(--brown); 
        }

        .stepper-line { 
            height: 2px; 
            background-color: rgba(93, 64, 55, 0.1); 
            flex-grow: 1; 
            margin: 0 10px; 
        }

        .stepper-dot { 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 14px; 
            font-weight: 900; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 2px solid transparent;
        }

        .stepper-dot.active { 
            background-color: var(--brown-medium) !important; 
            color: var(--cream) !important; 
            box-shadow: 0 0 0 4px var(--gold-light);
        }

        .stepper-dot.pending { 
            background-color: white !important; 
            color: var(--brown-light) !important; 
            border-color: rgba(93, 64, 55, 0.1) !important;
        }

        .stepper-dot.completed { 
            background-color: var(--gold) !important; 
            color: white !important; 
        }

        .card { 
            background: white; 
            border-radius: 24px; 
            border: 1px solid rgba(215, 204, 200, 0.5); 
            box-shadow: 0 10px 30px rgba(93, 64, 55, 0.05);
            overflow: hidden; 
        }

        .btn-continue { 
            background-color: var(--brown-medium); 
            color: var(--cream); 
            font-weight: 800; 
            padding: 18px; 
            border-radius: 16px; 
            width: 100%; 
            text-align: center; 
            font-size: 14px; 
            text-transform: uppercase; 
            letter-spacing: 0.2em; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 8px 20px rgba(93, 64, 55, 0.15); 
        }

        .btn-continue:hover:not(:disabled) { 
            background-color: var(--brown); 
            transform: translateY(-3px); 
            box-shadow: 0 12px 25px rgba(93, 64, 55, 0.25); 
        }

        .btn-continue:disabled { 
            background-color: var(--brown-light); 
            opacity: 0.5;
            cursor: not-allowed; 
            box-shadow: none; 
        }

        .form-input {
            width: 100%;
            background-color: var(--cream-dark);
            border: 1px solid rgba(93, 64, 55, 0.1);
            border-radius: 14px;
            padding: 14px 18px;
            outline: none;
            text-sm font-semibold;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--brown-medium);
            background-color: white;
            box-shadow: 0 0 0 4px var(--gold-light);
        }

        .label-style {
            text-[10px] font-black uppercase tracking-[0.2em] text-brown-light ml-1 mb-1 block;
        }

        .discount-banner { 
            background-color: #f0fdf4; 
            color: #166534; 
            padding: 16px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            font-weight: 700; 
            font-size: 13px; 
            border: 1px solid #dcfce7;
        }

        #address-map { 
            height: 250px; 
            width: 100%; 
            border-radius: 20px; 
            z-index: 10; 
        }

        .view-transition { transition: all 0.3s ease-in-out; }
        #checkout-main-layout { display: grid; grid-template-columns: 1fr; gap: 32px; width: 100%; }
        @media (min-width: 1024px) { #checkout-main-layout { grid-template-columns: 7fr 3fr; } }
        .sticky-summary { position: sticky; top: 100px; z-index: 40; }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes checkmark { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
        .animate-scaleIn { animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-checkmark { animation: checkmark 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards; opacity: 0; }
        .payment-card.selected { border-color: var(--brown-medium) !important; background-color: var(--gold-light) !important; }
    </style>
</head>

<body class="min-h-screen">

    <!-- Address Selection Drawer -->
    <div id="address-drawer" class="fixed inset-0 z-[110] flex justify-end hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeAddressDrawer()"></div>
        <div class="bg-white h-full shadow-2xl w-full max-w-md relative overflow-hidden transform transition-all duration-500 translate-x-full flex flex-col" id="address-drawer-container">
            <div class="p-6 border-b border-gray-100 flex items-center justify-between flex-shrink-0">
                <h3 class="text-lg font-black uppercase tracking-tight">Select Delivery Address</h3>
                <button onclick="closeAddressDrawer()" class="text-2xl p-2 hover:bg-gray-100 rounded-full transition-colors">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto relative">
                <div id="address-list-view" class="view-transition">
                    <div class="p-6 border-b border-brown/5">
                        <button onclick="switchToManageAddress()" class="text-brown-medium font-black uppercase tracking-widest text-[10px] flex items-center gap-2 hover:scale-105 transition-transform">
                            <ion-icon name="add-outline" class="text-lg"></ion-icon>
                            Add New Address
                        </button>
                    </div>
                    <div id="address-list" class="divide-y divide-gray-100"></div>
                </div>

                <div id="address-manage-view" class="view-transition absolute inset-0 bg-white translate-x-full overflow-y-auto">
                    <div class="p-6 space-y-6">
                        <div class="flex items-center gap-4 mb-4">
                            <button onclick="switchToListAddress()" class="text-2xl p-2 hover:bg-gray-100 rounded-full transition-colors">
                                <ion-icon name="arrow-back-outline"></ion-icon>
                            </button>
                            <h3 class="text-base font-black uppercase tracking-tight">Manage Address</h3>
                        </div>
                        <div class="relative group">
                            <div id="address-map" class="shadow-inner border border-gray-200"></div>
                            <button onclick="useGPS(event)" class="absolute bottom-4 right-4 z-[20] bg-white text-[#9c27b0] p-3 rounded-xl shadow-lg hover:bg-gray-50 transition-all flex items-center gap-2 font-black text-[10px] uppercase tracking-wider">
                                <ion-icon name="locate-outline" class="text-lg"></ion-icon> Use GPS
                            </button>
                        </div>
                        <div class="space-y-4">
                            <div class="space-y-1">
                                <label class="label-style">Street / Landmark</label>
                                <input type="text" id="manual-street" class="form-input">
                            </div>
                            <div class="space-y-1">
                                <label class="label-style">City / Town</label>
                                <input type="text" id="manual-city" class="form-input">
                            </div>
                        </div>
                        <button onclick="saveNewAddress(event)" class="btn-continue">
                            Save & Deliver Here
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 z-[100] flex justify-end hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeEditModal()"></div>
        <div class="bg-white h-full shadow-2xl w-full max-w-md relative overflow-hidden transform transition-all duration-500 translate-x-full" id="edit-modal-container">
            <div class="p-6 border-b border-gray-100 flex items-center justify-between">
                <h3 class="text-lg font-black uppercase tracking-tight">Edit Item</h3>
                <button onclick="closeEditModal()" class="text-2xl p-2 hover:bg-gray-100 rounded-full transition-colors"><ion-icon name="close-outline"></ion-icon></button>
            </div>
            <div class="p-6 space-y-6">
                <div class="flex gap-4">
                    <div class="w-20 h-20 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0">
                        <img id="edit-product-img" src="" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 space-y-1">
                        <h4 id="edit-product-title" class="text-sm font-bold leading-tight line-clamp-2">Product Title</h4>
                        <div class="flex items-center gap-2">
                            <span id="edit-product-price" class="text-sm font-black">₹0</span>
                            <span id="edit-product-original" class="text-xs text-gray-400 line-through">₹0</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-between border-t border-gray-50 pt-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase tracking-widest text-gray-400">Size</label>
                        <select id="edit-size-select" class="block w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2 text-sm font-bold outline-none focus:border-[#9c27b0]">
                            <option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="Free Size">Free Size</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase tracking-widest text-gray-400">Qty</label>
                        <div class="flex items-center border border-gray-200 rounded-lg bg-gray-50">
                            <button onclick="updateQty(-1)" class="px-3 py-2 text-gray-400 hover:text-[#9c27b0]"><ion-icon name="remove-outline"></ion-icon></button>
                            <span id="edit-qty-display" class="px-4 font-bold text-sm">1</span>
                            <button onclick="updateQty(1)" class="px-3 py-2 text-gray-400 hover:text-[#9c27b0]"><ion-icon name="add-outline"></ion-icon></button>
                        </div>
                    </div>
                </div>
                <div class="border-t border-brown/5 pt-6 flex justify-between items-center">
                    <span class="text-base font-bold text-brown-medium uppercase tracking-tight">Total Price</span>
                    <span id="edit-total-price" class="text-xl font-black text-brown italic">₹0</span>
                </div>
                <button onclick="saveEditChanges()" class="btn-continue">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/index.html" class="meesho-logo italic"><span class="text-[#8D6E63]">Hostel</span><span class="text-[#C8A951]">Mart</span></a>
            <div class="flex items-center gap-2 w-full max-w-xs justify-center">
                <div class="flex flex-col items-center gap-1"><div id="step-1-dot" class="stepper-dot active">1</div><span id="step-1-text" class="text-[10px] font-bold text-gray-500 uppercase">Review</span></div>
                <div id="step-line" class="stepper-line"></div>
                <div class="flex flex-col items-center gap-1"><div id="step-2-dot" class="stepper-dot pending">2</div><span id="step-2-text" class="text-[10px] font-bold text-gray-500 uppercase opacity-50">Payment</span></div>
            </div>
            <div class="flex items-center gap-4 md:gap-8 text-[#5D4037] font-bold text-sm auth-nav-slot">
                <!-- Auth UI will be injected here -->
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div id="checkout-main-layout">
            <div id="left-column-area" class="space-y-6">
                <!-- STEP 1 -->
                <div id="checkout-step-1" class="space-y-6">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-bold">Order Items (<span id="total-items-count">0</span>)</h2>
                        </div>
                        <div id="checkout-items-list" class="space-y-4">
                            <!-- Items will be injected here -->
                            <div class="card p-8 text-center space-y-4">
                                <div class="w-12 h-12 border-4 border-brown/10 border-t-brown animate-spin rounded-full mx-auto"></div>
                                <p class="text-sm font-bold text-brown-light uppercase tracking-widest">Loading Order Details...</p>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-xl bg-gold/10 flex items-center justify-center text-gold">
                                    <ion-icon name="location" class="text-xl"></ion-icon>
                                </div>
                                <h2 class="text-lg font-black text-brown uppercase tracking-tight">Delivery Details</h2>
                            </div>
                            <a href="Address.html?from=checkout" class="text-brown-medium text-[10px] font-black uppercase tracking-[0.2em] hover:text-gold transition-colors">Change Address</a>
                        </div>
                        <div class="card p-8 space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="space-y-1">
                                    <label class="label-style">Full Name</label>
                                    <input type="text" id="guest-name" placeholder="Enter your full name" class="form-input">
                                </div>
                                <div class="space-y-1">
                                    <label class="label-style">Phone Number</label>
                                    <input type="tel" id="guest-phone" placeholder="Enter phone number" class="form-input">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="space-y-1">
                                    <label class="label-style">Hostel Name</label>
                                    <input type="text" id="guest-hostel" placeholder="e.g. Aryabhatta Hostel" class="form-input">
                                </div>
                                <div class="space-y-1">
                                    <label class="label-style">Room Number</label>
                                    <input type="text" id="guest-room" placeholder="e.g. 302-B" class="form-input">
                                </div>
                            </div>
                            <div class="space-y-1">
                                <label class="label-style">Full Delivery Address</label>
                                <textarea id="guest-address" rows="2" placeholder="Detailed address/landmark..." class="form-input"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                </div>
            </div>

            <div class="right-area">
                <div class="sticky-summary space-y-4">
                    <div class="card p-8">
                        <p class="text-[10px] font-black uppercase tracking-[0.2em] text-brown-light mb-4">Pricing Summary</p>
                        <h2 id="price-details-title" class="text-xl font-black text-brown mb-8 uppercase tracking-tight italic">Order Value</h2>
                        <div class="space-y-5">
                            <div class="flex justify-between text-xs font-bold uppercase tracking-widest"><span class="text-brown-light">Total Price</span><span id="side-original-price" class="text-brown">+ ₹0</span></div>
                            <div class="flex justify-between text-xs font-bold uppercase tracking-widest"><span class="text-green-600">Discounts</span><span id="side-discount-amt" class="text-green-600">- ₹0</span></div>
                            <div class="pt-6 border-t border-brown/5 flex justify-between items-center"><span class="text-sm font-black uppercase tracking-widest">To Pay</span><span id="side-total-price" class="text-2xl font-black text-brown italic">₹0</span></div>
                        </div>
                        <div class="mt-8 discount-banner">
                            <ion-icon name="sparkles" class="text-green-600 text-lg"></ion-icon>
                            <span>Total savings: <span id="side-discount-text">₹0</span></span>
                        </div>
                        <div class="mt-8">
                            <button id="main-action-btn" onclick="handleContinue()" class="btn-continue">Proceed to Payment</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Removed Firebase client-side imports - using server API instead

        let checkoutItems = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            const singleItem = JSON.parse(localStorage.getItem('checkoutItem'));

            if (slug) {
                // Buy Now Flow
                await loadSingleProduct(slug, singleItem?.qty || 1);
            } else {
                // Cart Checkout Flow
                // Wait for cart_global.js to initialize if needed
                let attempts = 0;
                while (!window.getCart && attempts < 10) {
                    await new Promise(r => setTimeout(r, 100));
                    attempts++;
                }
                await loadCartProducts();
            }

            if (checkoutItems.length === 0) {
                document.getElementById('checkout-items-list').innerHTML = `
                    <div class="card p-12 text-center space-y-4">
                        <ion-icon name="cart-outline" class="text-6xl text-gray-200"></ion-icon>
                        <p class="font-bold text-gray-500">Your checkout session is empty.</p>
                        <a href="index.html" class="inline-block bg-brown text-white px-6 py-2 rounded-lg font-bold uppercase text-xs tracking-widest">Return to Home</a>
                    </div>
                `;
                calculateTotals(); // Will set ₹0
                return;
            }

            renderOrderItems();
            calculateTotals();
            
            const d = new Date(); d.setDate(d.getDate() + 4);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const deliveryDateElem = document.getElementById('delivery-date');
            if (deliveryDateElem) deliveryDateElem.textContent = `${d.getDate()} ${months[d.getMonth()]}`;
        });

        async function loadSingleProduct(slug, qty) {
            try {
                const res = await fetch(`/api/products?slug=${slug}`);
                const data = await res.json();
                const product = Array.isArray(data) ? data[0] : data;
                if (product) {
                    checkoutItems = [{
                        id: product.slug,
                        slug: product.slug,
                        title: product.name,
                        price: product.price,
                        originalPrice: product.originalPrice || Math.round(product.price * 1.2),
                        img: product.image,
                        brand: product.brand,
                        qty: qty,
                        size: localStorage.getItem('selectedSize') || 'Free Size'
                    }];
                }
            } catch (e) {
                console.error("Error loading product:", e);
            }
        }

        async function loadCartProducts() {
            console.log("Loading products from cart...");
            if (window.getCart) {
                const cart = window.getCart();
                console.log("Cart items retrieved:", cart);
                if (cart.length > 0) {
                    // Fetch latest prices for all items in cart using efficient slugs filter
                    const slugs = cart.map(item => item.slug || item.id).filter(s => s).join(',');
                    if (!slugs) {
                         console.warn("Cart has items but no valid slugs found.");
                         checkoutItems = cart.map(item => ({
                            ...item,
                            price: parseInt(String(item.currentPrice || item.price).replace(/[^\d]/g, '')),
                            originalPrice: parseInt(String(item.originalPrice || item.price).replace(/[^\d]/g, ''))
                         }));
                         return;
                    }
                    
                    try {
                        console.log("Fetching latest product data for slugs:", slugs);
                        const res = await fetch(`/api/products?slugs=${slugs}`);
                        const products = await res.json();
                        console.log("Fetched products from DB:", products);
                        
                        checkoutItems = cart.map(item => {
                            const latest = products.find(p => p.slug === (item.slug || item.id));
                            return {
                                ...item,
                                title: latest?.name || item.title || item.name,
                                price: latest?.price || parseInt(String(item.currentPrice || item.price).replace(/[^\d]/g, '')),
                                originalPrice: latest?.originalPrice || (latest?.price ? Math.round(latest.price * 1.2) : parseInt(String(item.originalPrice || item.price).replace(/[^\d]/g, ''))),
                                img: latest?.image || item.img || item.image,
                                brand: latest?.brand || item.brand
                            };
                        });
                    } catch (e) {
                        console.error("Error syncing cart prices:", e);
                        // Fallback to local data
                        checkoutItems = cart.map(item => ({
                            ...item,
                            price: parseInt(String(item.currentPrice || item.price).replace(/[^\d]/g, '')),
                            originalPrice: parseInt(String(item.originalPrice || item.price).replace(/[^\d]/g, ''))
                        }));
                    }
                } else {
                    console.log("Cart is empty according to getCart().");
                }
            } else {
                console.error("window.getCart is not defined after waiting.");
            }
        }

        function renderOrderItems() {
            const list = document.getElementById('checkout-items-list');
            document.getElementById('total-items-count').textContent = checkoutItems.length;
            
            list.innerHTML = checkoutItems.map((item, index) => `
                <div class="card overflow-hidden animate-fadeIn" style="animation-delay: ${index * 0.1}s">
                    <div class="px-6 py-2 bg-gray-50/50 border-b border-gray-100 flex items-center justify-between">
                         <div class="flex items-center gap-2">
                            <ion-icon name="bus-outline" class="text-lg text-gray-400"></ion-icon>
                            <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Standard Delivery</span>
                         </div>
                         <span class="text-[10px] font-black text-green-600 uppercase tracking-widest">Guaranteed</span>
                    </div>
                    <div class="p-6 flex gap-6">
                        <div class="w-24 h-24 bg-gray-50 rounded-2xl overflow-hidden flex-shrink-0 border border-gray-100 p-2">
                            <img src="${item.img}" class="w-full h-full object-contain">
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="text-sm font-bold text-brown leading-tight pr-8">${item.title}</h3>
                                <button onclick="openEditModal(${index})" class="text-gold text-[10px] font-black uppercase tracking-widest hover:underline">Edit</button>
                            </div>
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-tighter mb-2">${item.brand || 'HostelMart'}</p>
                            <div class="flex items-center gap-3 mb-2">
                                <span class="text-base font-black text-brown italic">₹${item.price.toLocaleString('en-IN')}</span>
                                ${item.originalPrice > item.price ? `<span class="text-xs text-gray-400 line-through">₹${item.originalPrice.toLocaleString('en-IN')}</span>` : ''}
                                ${item.originalPrice > item.price ? `<span class="text-[10px] font-black text-green-600">${Math.round((1 - item.price / item.originalPrice) * 100)}% OFF</span>` : ''}
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="bg-gold/5 px-3 py-1 rounded-lg border border-gold/10">
                                    <span class="text-[10px] font-black text-brown-medium uppercase tracking-widest">Qty: ${item.qty}</span>
                                </div>
                                <div class="bg-brown/5 px-3 py-1 rounded-lg border border-brown/10">
                                    <span class="text-[10px] font-black text-brown-medium uppercase tracking-widest">Size: ${item.size || 'Free Size'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function calculateTotals() {
            let totalActual = 0;
            let totalOriginal = 0;

            checkoutItems.forEach(item => {
                totalActual += (item.price * item.qty);
                totalOriginal += ((item.originalPrice || item.price) * item.qty);
            });

            const totalSavings = totalOriginal - totalActual;

            const updateText = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.textContent = val;
            };

            updateText('side-original-price', '₹' + totalOriginal.toLocaleString('en-IN'));
            updateText('side-discount-amt', '- ₹' + totalSavings.toLocaleString('en-IN'));
            updateText('side-total-price', '₹' + totalActual.toLocaleString('en-IN'));
            updateText('side-discount-text', '₹' + totalSavings.toLocaleString('en-IN'));
            
            // For UPI Payment page prep
            localStorage.setItem('pendingOrder', JSON.stringify({
                items: checkoutItems,
                totalAmount: '₹' + totalActual,
                totalActual: totalActual,
                totalOriginal: totalOriginal,
                totalSavings: totalSavings,
                orderId: 'HM' + Math.floor(Math.random() * 1000000)
            }));
        }

        window.handleContinue = async function() {
            const btn = document.getElementById('main-action-btn');
            
            // 1. Validate Items
            if (!checkoutItems || checkoutItems.length === 0) {
                alert('Your checkout session is empty. Please add items to proceed.');
                return;
            }

            // 2. Validate Inputs
            const name = document.getElementById('guest-name').value.trim();
            const phone = document.getElementById('guest-phone').value.trim();
            const hostel = document.getElementById('guest-hostel').value.trim();
            const room = document.getElementById('guest-room').value.trim();
            const address = document.getElementById('guest-address').value.trim();

            if (!name) { alert('Please enter your full name.'); return; }
            if (!phone || phone.length < 10) { alert('Please enter a valid 10-digit phone number.'); return; }
            if (!address || address.length < 5) { alert('Please enter a complete delivery address.'); return; }

            // 3. Save Data for Payment Page
            const deliveryDetails = { name, phone, hostel, room, address };
            
            btn.disabled = true;
            btn.innerHTML = '<ion-icon name="sync-outline" class="animate-spin"></ion-icon> SECURING SESSION...';

            try {
                // Sync with global profile manager
                if (window.ProfileManager) {
                    await window.ProfileManager.updateProfile(deliveryDetails);
                }

                // Save for PaymentMethod.html
                localStorage.setItem('deliveryDetails', JSON.stringify(deliveryDetails));
                
                // Final calculation sync
                calculateTotals();

                // Smooth redirect
                setTimeout(() => {
                    window.location.href = 'PaymentMethod.html';
                }, 800);
            } catch (e) {
                console.error("Checkout process error:", e);
                alert("An error occurred. Please try again.");
                btn.disabled = false;
                btn.innerHTML = 'Proceed to Payment';
            }
        };



        window.goToHome = () => window.location.href = 'index.html';
        window.closeEditModal = () => { 
            const container = document.getElementById('edit-modal-container');
            container.classList.add('translate-x-full');
            
            setTimeout(() => {
                document.getElementById('edit-modal').classList.add('hidden'); 
                document.body.style.overflow = 'auto'; 
            }, 500);
        };
        let currentEditIndex = -1;
        window.openEditModal = (index) => {
            currentEditIndex = index;
            const item = checkoutItems[index];
            if (!item) return;

            document.getElementById('edit-product-img').src = item.img;
            document.getElementById('edit-product-title').textContent = item.title;
            document.getElementById('edit-product-price').textContent = '₹' + item.price.toLocaleString('en-IN');
            document.getElementById('edit-qty-display').textContent = item.qty || 1;
            
            document.getElementById('edit-total-price').textContent = '₹' + (item.price * (item.qty || 1)).toLocaleString('en-IN');
            
            const sizeSelect = document.getElementById('edit-size-select');
            if (item.size) sizeSelect.value = item.size;

            const modal = document.getElementById('edit-modal');
            const container = document.getElementById('edit-modal-container');
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            setTimeout(() => {
                container.classList.remove('translate-x-full');
            }, 10);
        };
        window.saveEditChanges = () => {
            if (currentEditIndex === -1) return;
            const item = checkoutItems[currentEditIndex];
            item.size = document.getElementById('edit-size-select').value;
            item.qty = parseInt(document.getElementById('edit-qty-display').textContent);
            
            // If it was a single checkout item, update that too
            const singleItem = JSON.parse(localStorage.getItem('checkoutItem'));
            if (singleItem && singleItem.slug === item.slug) {
                localStorage.setItem('checkoutItem', JSON.stringify(item));
            }
            
            // If it's in the cart, update the cart too
            if (window.updateQuantity) {
                const cart = window.getCart();
                const cartIndex = cart.findIndex(c => (c.slug || c.id) === item.slug);
                if (cartIndex > -1) {
                    window.updateQuantity(cartIndex, item.qty);
                }
            }

            window.closeEditModal();
            renderOrderItems();
            calculateTotals();
        };
        window.updateQty = (d) => {
            const el = document.getElementById('edit-qty-display');
            let q = Math.max(1, parseInt(el.textContent) + d);
            el.textContent = q;
            const p = parseInt(document.getElementById('edit-product-price').textContent.replace(/[^\d]/g, ''));
            document.getElementById('edit-total-price').textContent = '₹' + (p * q).toLocaleString('en-IN');
        };
        window.openAddressDrawer = () => window.location.href = 'Address.html';
        window.closeAddressDrawer = () => {};
    </script>
</body>
</html>
