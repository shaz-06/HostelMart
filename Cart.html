<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | HostelMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="address_global.js" defer></script>
    <script src="auth_global.js" defer></script>
    <script src="cart_global.js" defer></script>
    <style>
        :root {
            --cream: #FDFBF7;
            --cream-dark: #F5F5DC;
            --brown: #3E2723;
            --brown-medium: #5D4037;
            --brown-light: #8D6E63;
            --gold: #C5A059;
            --gold-light: #FDF5E6;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--cream);
            color: var(--brown);
            touch-action: manipulation;
        }

        .hostelmart-header {
            background-color: var(--cream-dark);
            border-bottom: 1px solid rgba(215, 204, 200, 0.5);
            box-shadow: 0 4px 20px rgba(93, 64, 55, 0.05);
        }

        .cart-card {
            background: var(--cream);
            border: 1px solid rgba(215, 204, 200, 0.5);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(93, 64, 55, 0.05);
            overflow: hidden;
        }

        .cart-item-card {
            background: var(--cream);
            padding: 32px;
            border-bottom: 1px solid rgba(215, 204, 200, 0.3);
            display: flex;
            gap: 32px;
            transition: all 0.3s ease;
        }

        .cart-item-card:hover {
            background: var(--gold-light);
        }

        .price-details {
            background: var(--cream-dark);
            padding: 32px;
            border-radius: 24px;
            border: 1px solid rgba(215, 204, 200, 0.5);
            box-shadow: 0 10px 30px rgba(93, 64, 55, 0.05);
            position: sticky;
            top: 100px;
        }

        .place-order-btn {
            background-color: #3E2723 !important;
            color: #FDFBF7 !important;
            width: 100%;
            padding: 20px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(93, 64, 55, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .place-order-btn:hover {
            background-color: #5D4037 !important;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(93, 64, 55, 0.3);
        }


        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--gold-light);
            border: 1px solid rgba(215, 204, 200, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--brown-medium);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .qty-btn:hover {
            background: var(--brown-medium);
            color: var(--cream);
            border-color: var(--brown-medium);
        }

        .remove-btn {
            color: var(--brown-light);
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            color: #d32f2f;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .search-bar {
            background: rgba(253, 245, 230, 0.5);
            border: 1px solid rgba(215, 204, 200, 0.8);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .search-bar:focus-within {
            background: white;
            border-color: var(--brown-medium);
            box-shadow: 0 0 0 4px rgba(93, 64, 55, 0.1);
        }

    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="hostelmart-header py-3">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-12 flex-1">
                <a href="index.html" class="flex items-center gap-1 no-underline">
                    <span class="font-black italic text-2xl flex items-center">
                        <span class="text-[#8D6E63]">Hostel</span>
                        <span class="text-[#C8A951] ml-1">Mart</span>
                    </span>
                </a>
                <div class="flex-1 max-w-2xl relative group">
                    <div class="search-bar flex items-center px-4 py-2.5">
                        <ion-icon name="search-outline" class="text-[#8D6E63] text-xl mr-3"></ion-icon>
                        <input type="text" placeholder="Search for Products, Brands and More"
                            class="w-full bg-transparent border-none outline-none text-sm font-medium text-brown">
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-8 ml-12 font-bold text-sm text-[#5D4037]">
                <div class="flex items-center gap-2 cursor-pointer hover:text-brown-light transition-colors">
                    <div class="w-8 h-8 rounded-full bg-gold-light flex items-center justify-center border border-brown/10">
                        <ion-icon name="person-outline" class="text-lg"></ion-icon>
                    </div>
                    <span id="header-user-name">Shashank</span>
                    <ion-icon name="chevron-down-outline" class="text-[10px]"></ion-icon>
                </div>

                <a href="Cart.html" class="flex items-center gap-2 relative text-[#5D4037] hover:text-[#8D6E63] transition-colors">
                    <ion-icon name="cart-outline" class="text-2xl"></ion-icon>
                    <span class="hidden md:inline">Cart</span>
                    <span class="absolute -top-1 -right-2 bg-brown text-cream text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-black border-2 border-cream-dark cart-badge">0</span>
                </a>

            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 container mx-auto px-4 md:px-10 py-6 max-w-7xl">
        <div id="cart-content" class="flex flex-col lg:flex-row gap-4">
            <!-- Loading State -->
            <div class="w-full text-center py-20">
                <ion-icon name="sync-outline" class="text-4xl animate-spin text-gray-400"></ion-icon>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-gray-200 mt-20 py-10">
        <div class="container mx-auto px-6 text-center text-xs text-gray-500 font-bold uppercase tracking-widest">
            &copy; 2024 HOSTELMART. All Rights Reserved.
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
            
            // Sync user name
            const userName = localStorage.getItem('userName');
            if (userName) {
                document.getElementById('header-user-name').textContent = userName;
            }
        });

        function renderCart() {
            const container = document.getElementById('cart-content');
            const cart = window.getCart ? window.getCart() : [];
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="w-full bg-cream border border-brown/5 rounded-[40px] p-16 flex flex-col items-center justify-center text-center space-y-8 animate-fadeIn shadow-xl shadow-brown/5">
                        <div class="w-48 h-48 bg-gold-light rounded-full flex items-center justify-center relative">
                            <ion-icon name="cart-outline" class="text-8xl text-brown/20"></ion-icon>
                            <div class="absolute -top-2 -right-2 w-12 h-12 bg-gold rounded-full flex items-center justify-center text-white text-2xl shadow-lg animate-bounce">
                                <ion-icon name="search-outline"></ion-icon>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <h2 class="text-3xl font-black text-brown uppercase tracking-tight italic">Your cart is empty</h2>
                            <p class="text-sm text-brown-light font-bold">Discover our premium collection and start shopping</p>
                        </div>
                        <a href="index.html" class="bg-brown-medium text-cream font-black px-12 py-5 rounded-2xl text-xs uppercase tracking-[0.2em] shadow-xl hover:bg-brown transition-all transform hover:scale-105">
                            Return to Store
                        </a>
                    </div>
                `;
                return;
            }


            // Cart has items
            let itemsHTML = '';
            let totalPrice = 0;
            let totalDiscount = 0;

            cart.forEach((item, index) => {
                const price = parseInt(item.currentPrice.replace(/[^\d]/g, ''));
                const original = item.originalPrice ? parseInt(item.originalPrice.replace(/[^\d]/g, '')) : price;
                totalPrice += (original * item.qty);
                totalDiscount += (original - price) * item.qty;

                itemsHTML += `
                    <div class="cart-item-card animate-fadeIn" style="animation-delay: ${index * 0.1}s">
                        <div class="w-32 flex flex-col items-center gap-4">
                            <div class="w-32 h-32 bg-white rounded-2xl p-4 border border-brown/5 shadow-inner">
                                <img src="${item.img}" class="w-full h-full object-contain" alt="${item.title}">
                            </div>
                            <div class="flex items-center justify-center gap-4 bg-cream-dark/50 p-2 rounded-xl border border-brown/10">
                                <button onclick="handleQtyChange(${index}, -1)" class="qty-btn">-</button>
                                <span class="text-sm font-black w-6 text-center text-brown">${item.qty}</span>
                                <button onclick="handleQtyChange(${index}, 1)" class="qty-btn">+</button>
                            </div>
                        </div>
                        <div class="flex-1 space-y-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="text-xl font-black text-brown tracking-tight">${item.title}</h3>
                                    <p class="text-sm text-brown-light font-extrabold uppercase tracking-widest mt-1">${item.brand}</p>
                                </div>
                                <div class="text-right">
                                    <div class="flex flex-col items-end">
                                        <span class="text-2xl font-black text-brown">${item.currentPrice}</span>
                                        ${item.originalPrice ? `<span class="text-sm text-brown-light/50 line-through font-bold">${item.originalPrice}</span>` : ''}
                                    </div>
                                    <span class="inline-block bg-green-50 text-green-700 text-[10px] font-black px-2 py-1 rounded-md mt-2 uppercase tracking-tighter">Best Deal Applied</span>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-6 py-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] font-black uppercase text-brown-light/60 tracking-widest">Variant</span>
                                    <span class="bg-gold-light border border-brown/10 px-3 py-1 rounded-lg text-xs font-black text-brown-medium">${item.size}</span>
                                </div>
                                <div class="flex items-center gap-2 text-brown-light">
                                    <ion-icon name="time-outline"></ion-icon>
                                    <span class="text-[10px] font-bold uppercase tracking-widest">Delivery by Tomorrow</span>
                                </div>
                            </div>

                            <div class="pt-6 flex gap-8 border-t border-brown/5">
                                <button onclick="handleRemove(${index})" class="remove-btn flex items-center gap-2 group">
                                    <ion-icon name="trash-outline" class="text-lg group-hover:scale-110 transition-transform"></ion-icon>
                                    Remove
                                </button>
                                <button class="text-[10px] font-black uppercase text-brown-medium hover:text-gold transition-colors flex items-center gap-2">
                                    <ion-icon name="bookmark-outline" class="text-lg"></ion-icon>
                                    Save for later
                                </button>
                            </div>
                        </div>
                    </div>
                `;

            });

            const finalPrice = totalPrice - totalDiscount;

            container.innerHTML = `
                <!-- ITEMS LIST -->
                <div class="flex-1 space-y-6">
                    <div class="bg-cream-dark px-8 py-5 flex justify-between items-center rounded-3xl border border-brown/5 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-brown-medium rounded-full flex items-center justify-center text-cream">
                                <ion-icon name="cart" class="text-xl"></ion-icon>
                            </div>
                            <h2 class="text-lg font-black text-brown uppercase tracking-tight">Shopping Bag <span class="text-brown-light/60 italic ml-1">(${cart.length})</span></h2>
                        </div>
                        <div class="flex items-center gap-3 bg-cream/80 px-4 py-2 rounded-2xl border border-brown/10 shadow-inner">
                            <ion-icon name="location" class="text-brown-light"></ion-icon>
                            <span class="text-[10px] font-black uppercase tracking-widest text-brown-medium">Ship to: <span class="text-brown">Bangalore</span></span>
                        </div>
                    </div>
                    <div class="cart-card">
                        ${itemsHTML}
                    </div>
                    <div class="bg-cream-dark/80 backdrop-blur-md p-6 flex justify-end sticky bottom-4 rounded-[2rem] border border-brown/10 shadow-2xl z-20">
                        <div class="flex items-center gap-8 w-full md:w-auto">
                            <div class="hidden md:block text-right">
                                <p class="text-[10px] font-black uppercase text-brown-light tracking-widest">Total Payable</p>
                                <p class="text-2xl font-black text-brown">₹${finalPrice.toLocaleString()}</p>
                            </div>
                            <a href="Checkout.html" class="place-order-btn text-center md:min-w-[280px]">Proceed to Checkout</a>
                        </div>
                    </div>
                </div>

                <!-- PRICE DETAILS -->
                <div class="lg:w-[420px]">
                    <div class="price-details space-y-8 animate-fadeIn">
                        <div class="flex items-center gap-3 border-b border-brown/10 pb-6">
                            <ion-icon name="receipt-outline" class="text-2xl text-brown-light"></ion-icon>
                            <h3 class="text-brown font-black uppercase tracking-widest text-xs">Order Summary</h3>
                        </div>
                        
                        <div class="space-y-5">
                            <div class="flex justify-between items-center text-xs font-bold text-brown-light uppercase tracking-widest">
                                <span>Cart Subtotal (${cart.length})</span>
                                <span class="text-brown text-sm font-black">₹${totalPrice.toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between items-center text-xs font-bold text-brown-light uppercase tracking-widest">
                                <span>Bag Discount</span>
                                <span class="text-green-600 text-sm font-black">-₹${totalDiscount.toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between items-center text-xs font-bold text-brown-light uppercase tracking-widest border-b border-dashed border-brown/20 pb-6">
                                <span>Convenience Fee</span>
                                <span class="text-green-600 text-[10px] font-black bg-green-50 px-2 py-1 rounded">FREE</span>
                            </div>
                            <div class="flex justify-between items-center pt-2">
                                <span class="text-sm font-black text-brown uppercase tracking-widest">Grand Total</span>
                                <span class="text-3xl font-black text-brown">₹${finalPrice.toLocaleString()}</span>
                            </div>
                        </div>

                        <div class="bg-gold-light/80 p-5 rounded-2xl border border-gold/20 flex items-start gap-4">
                            <div class="w-8 h-8 bg-gold rounded-full flex items-center justify-center flex-shrink-0 text-white shadow-lg">
                                <ion-icon name="sparkles"></ion-icon>
                            </div>
                            <div>
                                <p class="text-gold text-[10px] font-black uppercase tracking-widest">HostelMart Savings</p>
                                <p class="text-brown font-black text-sm mt-1">You save ₹${totalDiscount.toLocaleString()} on this bag</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-8 bg-brown-medium/5 rounded-3xl p-6 border border-brown/10 flex items-center gap-5 animate-fadeIn" style="animation-delay: 0.3s">
                        <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-lg text-brown-light">
                            <ion-icon name="shield-checkmark" class="text-2xl"></ion-icon>
                        </div>
                        <div>
                            <p class="text-[10px] font-black uppercase text-brown tracking-widest leading-tight">Secured Payments</p>
                            <p class="text-[9px] font-bold text-brown-light mt-1 uppercase tracking-tighter">100% Buyer Protection Guarantee</p>
                        </div>
                    </div>
                </div>

            `;
        }

        function handleQtyChange(index, delta) {
            const cart = window.getCart();
            const newQty = (cart[index].qty || 1) + delta;
            if (newQty < 1) return;
            window.updateQuantity(index, newQty);
            renderCart();
        }

        function handleRemove(index) {
            window.removeFromCart(index);
            renderCart();
        }

    </script>
</body>

</html>
