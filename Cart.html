<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | HostelMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="address_global.js" defer></script>
    <script src="auth_global.js" defer></script>
    <script src="cart_global.js" defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F1F3F6;
            color: #212121;
        }

        .hostelmart-header {
            background-color: #F5F5DC;
            border-bottom: 1px solid #D7CCC8;
        }

        .cart-item-card {
            background: white;
            padding: 24px;
            border-bottom: 1px solid #F0F0F0;
            display: flex;
            gap: 24px;
        }

        .price-details {
            background: white;
            padding: 24px;
            border-radius: 4px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.1);
            position: sticky;
            top: 80px;
        }

        .place-order-btn {
            background: #FB641B;
            color: white;
            width: 100%;
            padding: 16px;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            border-radius: 2px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.2);
            transition: background 0.2s;
        }

        .place-order-btn:hover {
            background: #f4510b;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #E0E0E0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
        }

        .qty-btn:hover {
            border-color: #5D4037;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="hostelmart-header py-3">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-12 flex-1">
                <a href="index.html" class="flex items-center gap-1 no-underline">
                    <span class="font-black italic text-2xl flex items-center">
                        <span class="text-[#8D6E63]">Hostel</span>
                        <span class="text-[#C8A951] ml-1">Mart</span>
                    </span>
                </a>
                <div class="flex-1 max-w-2xl relative">
                    <input type="text" placeholder="Search for Products, Brands and More"
                        class="w-full bg-white border border-[#D7CCC8] rounded px-4 py-2 text-sm outline-none shadow-sm focus:shadow-md transition-shadow">
                    <ion-icon name="search" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#8D6E63] text-lg"></ion-icon>
                </div>
            </div>
            <div class="flex items-center gap-8 ml-12 font-bold text-sm text-[#5D4037]">
                <div class="flex items-center gap-1 cursor-pointer">
                    <ion-icon name="person-circle-outline" class="text-2xl"></ion-icon>
                    <span id="header-user-name">Shashank</span>
                    <ion-icon name="chevron-down-outline" class="text-xs"></ion-icon>
                </div>
                <a href="Cart.html" class="flex items-center gap-2 relative text-blue-600">
                    <ion-icon name="cart-outline" class="text-2xl"></ion-icon>
                    <span>Cart</span>
                    <span class="absolute -top-2 -right-2 bg-[#5D4037] text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center border-2 border-white cart-badge">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 container mx-auto px-4 md:px-10 py-6 max-w-7xl">
        <div id="cart-content" class="flex flex-col lg:flex-row gap-4">
            <!-- Loading State -->
            <div class="w-full text-center py-20">
                <ion-icon name="sync-outline" class="text-4xl animate-spin text-gray-400"></ion-icon>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-gray-200 mt-20 py-10">
        <div class="container mx-auto px-6 text-center text-xs text-gray-500 font-bold uppercase tracking-widest">
            &copy; 2024 HOSTELMART. All Rights Reserved.
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
            
            // Sync user name
            const userName = localStorage.getItem('userName');
            if (userName) {
                document.getElementById('header-user-name').textContent = userName;
            }
        });

        function renderCart() {
            const container = document.getElementById('cart-content');
            const cart = window.getCart ? window.getCart() : [];
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="w-full bg-white p-12 flex flex-col items-center justify-center text-center space-y-6 animate-fadeIn">
                        <img src="https://cdn-icons-png.flaticon.com/512/11329/11329073.png" class="w-64 h-64 opacity-80" alt="Empty Cart">
                        <div>
                            <h2 class="text-xl font-black uppercase tracking-tight">Your cart is empty!</h2>
                            <p class="text-xs text-gray-400 font-medium mt-2">Add items to it now to see them here.</p>
                        </div>
                        <a href="index.html" class="bg-[#FB641B] text-white font-black px-12 py-4 rounded-sm text-sm uppercase shadow-lg hover:bg-[#f4510b] transition-all transform hover:scale-105">
                            Shop Now
                        </a>
                    </div>
                `;
                return;
            }

            // Cart has items
            let itemsHTML = '';
            let totalPrice = 0;
            let totalDiscount = 0;

            cart.forEach((item, index) => {
                const price = parseInt(item.currentPrice.replace(/[^\d]/g, ''));
                const original = item.originalPrice ? parseInt(item.originalPrice.replace(/[^\d]/g, '')) : price;
                totalPrice += (original * item.qty);
                totalDiscount += (original - price) * item.qty;

                itemsHTML += `
                    <div class="cart-item-card animate-fadeIn" style="animation-delay: ${index * 0.1}s">
                        <div class="w-28 h-28 flex-shrink-0">
                            <img src="${item.img}" class="w-full h-full object-contain" alt="${item.title}">
                            <div class="flex items-center justify-center gap-3 mt-4">
                                <button onclick="handleQtyChange(${index}, -1)" class="qty-btn">-</button>
                                <span class="text-sm font-bold w-8 text-center">${item.qty}</span>
                                <button onclick="handleQtyChange(${index}, 1)" class="qty-btn">+</button>
                            </div>
                        </div>
                        <div class="flex-1 space-y-2">
                            <h3 class="text-lg font-medium">${item.title}</h3>
                            <p class="text-sm text-gray-400 font-bold">${item.brand}</p>
                            <p class="text-xs text-gray-500">Size: <span class="font-bold text-gray-700">${item.size}</span></p>
                            <div class="flex items-center gap-2 pt-2">
                                <span class="text-lg font-black">${item.currentPrice}</span>
                                ${item.originalPrice ? `<span class="text-sm text-gray-400 line-through">${item.originalPrice}</span>` : ''}
                                <span class="text-xs font-bold text-green-600">Offers Applied</span>
                            </div>
                            <div class="pt-4 flex gap-6">
                                <button onclick="handleRemove(${index})" class="text-sm font-black uppercase hover:text-red-600 transition-colors">Remove</button>
                                <button class="text-sm font-black uppercase hover:text-blue-600 transition-colors">Save for later</button>
                            </div>
                        </div>
                        <div class="text-sm text-gray-500 font-medium">
                            Delivery by Tomorrow, Fri | <span class="text-green-600">Free</span>
                        </div>
                    </div>
                `;
            });

            const finalPrice = totalPrice - totalDiscount;

            container.innerHTML = `
                <!-- ITEMS LIST -->
                <div class="flex-1 space-y-4">
                    <div class="bg-white px-6 py-4 flex justify-between items-center shadow-sm">
                        <h2 class="text-lg font-bold">HostelMart Cart (${cart.length})</h2>
                        <div class="flex items-center gap-2 text-sm">
                            <ion-icon name="location-outline"></ion-icon>
                            <span>Deliver to: <span class="font-bold">Bengaluru - 560001</span></span>
                        </div>
                    </div>
                    <div class="bg-white shadow-sm">
                        ${itemsHTML}
                    </div>
                    <div class="bg-white p-4 flex justify-end sticky bottom-0 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
                        <a href="Checkout.html" class="place-order-btn text-center max-w-xs">Place Order</a>
                    </div>
                </div>

                <!-- PRICE DETAILS -->
                <div class="lg:w-[400px]">
                    <div class="price-details space-y-6">
                        <h3 class="text-gray-500 font-bold uppercase tracking-wider text-xs border-b border-gray-100 pb-4">Price Details</h3>
                        <div class="space-y-4">
                            <div class="flex justify-between text-sm">
                                <span>Price (${cart.length} items)</span>
                                <span>₹${totalPrice.toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span>Discount</span>
                                <span class="text-green-600">-₹${totalDiscount.toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between text-sm border-b border-dashed border-gray-200 pb-4">
                                <span>Delivery Charges</span>
                                <span class="text-green-600">FREE</span>
                            </div>
                            <div class="flex justify-between text-lg font-black pt-2">
                                <span>Total Amount</span>
                                <span>₹${finalPrice.toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="bg-green-50 p-3 rounded-sm border border-green-100">
                            <p class="text-green-700 text-sm font-bold">You will save ₹${totalDiscount.toLocaleString()} on this order</p>
                        </div>
                    </div>
                    <div class="mt-6 flex items-center gap-4 text-gray-400 p-4">
                        <ion-icon name="shield-checkmark" class="text-2xl"></ion-icon>
                        <p class="text-[10px] font-bold uppercase leading-tight">Safe and Secure Payments. 100% Authentic products.</p>
                    </div>
                </div>
            `;
        }

        function handleQtyChange(index, delta) {
            const cart = window.getCart();
            const newQty = (cart[index].qty || 1) + delta;
            if (newQty < 1) return;
            window.updateQuantity(index, newQty);
            renderCart();
        }

        function handleRemove(index) {
            if (confirm('Are you sure you want to remove this item?')) {
                window.removeFromCart(index);
                renderCart();
            }
        }
    </script>
</body>

</html>
