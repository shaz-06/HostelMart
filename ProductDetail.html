<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | HostelMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FDFBF7;
            color: #3E2723;
        }
        .main-image-container:hover img {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="antialiased">

    <!-- Header Section -->
    <header class="bg-[#F5F5DC] border-b border-[#D7CCC8]">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black italic">
                <span class="text-[#8D6E63]">Hostel</span><span class="text-[#C8A951]">Mart</span>
            </a>
            <a href="Cart.html" class="relative group">
                <ion-icon name="cart-outline" class="text-2xl text-[#5D4037]"></ion-icon>
            </a>
        </div>
    </header>

    <main id="product-content" class="container mx-auto px-4 py-12">
        <!-- Loading State -->
        <div id="loading" class="py-20 text-center">
            <div class="inline-block w-12 h-12 border-4 border-[#5D4037] border-t-transparent rounded-full animate-spin"></div>
        </div>

        <!-- Product View (Hidden until loaded) -->
        <div id="product-view" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-12">
            <!-- Left: Images -->
            <div class="space-y-6">
                <div class="main-image-container aspect-square bg-white rounded-[3rem] overflow-hidden border border-[#D7CCC8]/50 shadow-xl group">
                    <img id="main-image" src="" class="w-full h-full object-cover transition-transform duration-700" alt="">
                </div>
                <div id="image-gallery" class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
                    <!-- Gallery thumbs -->
                </div>
            </div>

            <!-- Right: Info -->
            <div class="flex flex-col">
                <nav class="text-xs font-bold text-gray-400 mb-4 uppercase tracking-widest flex items-center gap-2">
                    <a href="index.html">Home</a>
                    <ion-icon name="chevron-forward"></ion-icon>
                    <span id="breadcrumb-category" class="text-[#5D4037]">Category</span>
                </nav>

                <h1 id="product-name" class="text-4xl font-black text-[#5D4037] mb-2 leading-tight">Product Name</h1>
                <div class="flex items-center gap-4 mb-6">
                    <span id="product-brand" class="bg-[#F5F5DC] text-[#8D6E63] text-xs font-black px-3 py-1.5 rounded-full uppercase tracking-widest">Brand</span>
                    <div class="flex items-center gap-1 text-yellow-500 font-black">
                        <ion-icon name="star"></ion-icon>
                        <span id="product-rating">4.5</span>
                    </div>
                </div>

                <div class="flex items-baseline gap-4 mb-8">
                    <span id="product-price" class="text-4xl font-black text-[#5D4037]">₹0</span>
                    <span id="product-original" class="text-xl text-gray-400 line-through">₹0</span>
                    <span id="product-discount" class="text-green-600 font-bold">0% OFF</span>
                </div>

                <div class="space-y-6 mb-10">
                    <div class="bg-[#F5F5DC]/30 p-6 rounded-3xl border border-[#D7CCC8]/50">
                        <h3 class="font-black text-[#5D4037] mb-3 uppercase tracking-widest text-xs">Product Details</h3>
                        <p id="product-desc" class="text-gray-600 leading-relaxed text-sm">Description goes here.</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-[#8D6E63] border border-[#D7CCC8]/50">
                                <ion-icon name="layers-outline"></ion-icon>
                            </div>
                            <div>
                                <p class="text-[10px] font-black text-gray-400 uppercase tracking-tighter">Material</p>
                                <p id="product-material" class="font-bold text-[#5D4037]">Plastic</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-[#8D6E63] border border-[#D7CCC8]/50">
                                <ion-icon name="flask-outline"></ion-icon>
                            </div>
                            <div>
                                <p class="text-[10px] font-black text-gray-400 uppercase tracking-tighter">Capacity</p>
                                <p id="product-capacity" class="font-bold text-[#5D4037]">20L</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex flex-col sm:flex-row gap-4 mt-auto">
                    <button onclick="addToCart()" class="flex-1 bg-[#F5F5DC] text-[#5D4037] py-5 rounded-2xl font-black uppercase tracking-widest hover:bg-[#D7CCC8] transition-all flex items-center justify-center gap-2">
                        <ion-icon name="cart-outline" class="text-xl"></ion-icon>
                        Add to Cart
                    </button>
                    <button onclick="buyNow()" class="flex-1 bg-[#5D4037] text-white py-5 rounded-2xl font-black uppercase tracking-widest hover:bg-[#3E2723] shadow-xl shadow-[#D7CCC8]/50 transition-all">
                        Buy Now
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        let currentProduct = null;

        async function fetchProductDetails() {
            if (!slug) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await fetch(`/api/products/slug/${slug}`);
                const product = await response.json();
                if (!product) throw new Error("Product not found");
                
                currentProduct = product;
                renderProduct(product);
            } catch (error) {
                document.getElementById('product-content').innerHTML = `
                    <div class="py-20 text-center">
                        <h2 class="text-2xl font-black text-[#5D4037]">Oops! Product not found.</h2>
                        <a href="Buckets.html" class="mt-6 inline-block bg-[#5D4037] text-white px-8 py-3 rounded-xl font-bold">Back to Buckets</a>
                    </div>
                `;
            }
            document.getElementById('loading').classList.add('hidden');
        }

        function renderProduct(p) {
            document.title = `${p.name} | HostelMart`;
            document.getElementById('main-image').src = p.image;
            document.getElementById('breadcrumb-category').textContent = p.subcategory || p.category;
            document.getElementById('product-name').textContent = p.name;
            document.getElementById('product-brand').textContent = p.brand;
            document.getElementById('product-rating').textContent = p.rating || '4.0';
            document.getElementById('product-price').textContent = `₹${p.price.toLocaleString('en-IN')}`;
            document.getElementById('product-original').textContent = p.originalPrice ? `₹${p.originalPrice.toLocaleString('en-IN')}` : '';
            document.getElementById('product-discount').textContent = p.discount || '';
            document.getElementById('product-desc').textContent = p.description;
            document.getElementById('product-material').textContent = p.material || 'N/A';
            document.getElementById('product-capacity').textContent = p.capacity || 'N/A';

            // Gallery
            if (p.images && p.images.length > 0) {
                const gallery = document.getElementById('image-gallery');
                gallery.innerHTML = [p.image, ...p.images].map(img => `
                    <div class="w-20 h-20 rounded-2xl overflow-hidden border border-[#D7CCC8]/50 flex-shrink-0 cursor-pointer hover:border-[#5D4037] transition-all" onclick="updateMainImage('${img}')">
                        <img src="${img}" class="w-full h-full object-cover">
                    </div>
                `).join('');
            }

            document.getElementById('product-view').classList.remove('hidden');
        }

        function updateMainImage(src) {
            document.getElementById('main-image').src = src;
        }

        function addToCart() {
            alert("Added to cart: " + currentProduct.name);
        }

        function buyNow() {
            window.location.href = `Checkout.html?slug=${currentProduct.slug}`;
        }

        fetchProductDetails();
    </script>
</body>
</html>
